{% extends 'base.html' %}

{% block content %}
  <header>
    <h1>List of Enemies</h1>
  </header>
  {% if enemy_list %}
    <ul>
      {% for enemy in enemy_list %}
        <li>
          {{ enemy }}
          <a href="/core/enemies/edit/{{enemy.id}}">Edit</a>
          <a href="/core/enemies/delete/{{enemy.id}}">Delete</a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No enemies yet.</p>
  {% endif %}
  <a href="enemies/create">Add Enemy</a>
{% endblock %}
