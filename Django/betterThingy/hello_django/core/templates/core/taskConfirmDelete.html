{% extends 'base.html' %}

{% block content %}

<h1>Confirm Delete</h1>
<form method="post">
  {% csrf_token %}
  <h2>Are you sure you want to delete this task?</h2>
  <p>Deleting: {{ task.name }}</p>
  <button type="submit">Yes, delete</button>
  <a href="{% url 'core:todo' %}">No, go back</a>
</form>

{% endblock %}
