{% extends 'base.html' %}

{% block content %}
<header>
  <h1>Todo List</h1>
</header>
<p>Here are some of my tasks</p>
<ol>
  {% for task in tasks %}
    <li>{{ task.name }}</li>
  {% endfor %}
</ol>
<hr>
<h3>Add a new task</h3>
<form method="post">
  {% csrf_token %}
  <p>
    <label for="name">Name:</label>
    <input type="text" name="name" />
  </p>
  <p>
    <label for="description">Description:</label>
    <input type="text" name="description" />
  </p>
  <input type="submit"/>
</form>
{% endblock %}
